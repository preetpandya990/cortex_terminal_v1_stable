# Cortex AI — Alembic Configuration
# ====================================
# Run migrations: alembic upgrade head
# Generate new migration: alembic revision --autogenerate -m "description"
# View history: alembic history
# Downgrade one step: alembic downgrade -1

[alembic]
# script_location points to the alembic/ directory in the backend
script_location = alembic

# The DB URL is NOT set here — it is read from app.core.config.Settings.DATABASE_URL
# so secrets stay in .env and never in this file.
# See alembic/env.py for how the URL is injected.
sqlalchemy.url =

# File name template for generated migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long migration message slugs
truncate_slug_length = 40

# Revision range used by "alembic history"
revision_environment = false

# Set to 'true' to enable color output on supported terminals
# (install colorama for Windows)
# output_encoding = utf-8

[post_write_hooks]
# Optional: run ruff format on generated migration files
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S