[pytest]
cache_dir = .cache/pytest
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Production-grade test configuration
addopts =
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=5
    --timeout=300
    -ra
    --color=yes

markers =
    unit: Pure unit tests with no I/O
    integration: Tests that hit the test DB
    api: API contract tests via HTTP client
    slow: Tests that take >1s to run
    performance: Performance and load tests

# Timeout settings
timeout = 300
timeout_method = thread

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch
    ignore::UserWarning:sqlalchemy
    # XGBoost emits UserWarning from C-level ctypes callbacks that Python's
    # warning filter machinery cannot intercept at the module level.  The root
    # cause (passing unknown params like n_estimators) is fixed in trainer code;
    # this entry silences residual C-callback warnings that reach pytest's
    # unraisable-exception handler.
    ignore::UserWarning:xgboost
    # mlflow-skinny 3.x triggers a pydantic v2 namespace warning on import; not our code
    ignore::UserWarning:pydantic
