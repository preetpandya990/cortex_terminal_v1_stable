# Prometheus Configuration for Cortex AI
# =======================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cortex-ai'
    environment: 'development'

scrape_configs:
  - job_name: 'cortex-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
