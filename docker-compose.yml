# Cortex AI — Docker Compose
# ============================
# Development & staging orchestration.
# Production: use Kubernetes or ECS with secrets manager injection.
#
# HOW VARIABLE RESOLUTION WORKS
# ──────────────────────────────
# Docker Compose resolves ${VAR} at parse time — before any container starts.
# It reads values from (in priority order):
#   1. Shell environment variables
#   2. The .env file in the same directory as this docker-compose.yml
#   3. Inline defaults: ${VAR:-default}
#
# The POSTGRES_PASSWORD defined inside a service's `environment:` block is
# only available *inside* that container — it is NOT available to the
# interpolation engine when building DATABASE_URL in another service.
#
# SOLUTION: all shared variables are defined ONCE in .env (or your shell).
# Each service reads them independently from that single source.
# Nothing is assembled inside this file — no cross-service interpolation.
#
# SETUP
# ──────
#   cp backend/.env.example .env       ← one .env at the project root
#   # fill in POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, SECRET_KEY, etc.
#   docker compose up --build

services:

  # ── TimescaleDB HA (PostgreSQL 16 + TimescaleDB 2.27.1 + pgvector 0.8.2) ─────
  # Official timescaledb-ha image — ships with TimescaleDB and pgvector pre-installed.
  # No custom Dockerfile required.
  #
  # Data lives in the external volume `postgres_data_tsdb` (created during the
  # 2026-06-03 migration from postgres:16-alpine → timescaledb-ha:pg16).
  # The old volume `cortex_merge_ai-ml_postgres_data` is retained as a backup
  # and can be removed after 24h of verified operation.
  #
  # PGDATA path is /home/postgres/pgdata/data — differs from standard postgres image.
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: cortex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex_pg}
      POSTGRES_DB: ${POSTGRES_DB:-cortex_db}
      PGDATA: /home/postgres/pgdata/data
    volumes:
      - postgres_data_tsdb:/home/postgres/pgdata/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cortex-network

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex-network

  # ── Redpanda (Kafka API — durable job queues) ─────────────────────────────
  # Single-node Redpanda carries all durable queueing (explanation, context,
  # forecast batch, classifier); Redis keeps cache/pub-sub/locks/SSE stores.
  #
  # Production flags per Redpanda's production-readiness checklist — NOT
  # --mode=dev-container (that sets developer_mode=true):
  #   --reserve-memory=0M   mandatory in containers (Seastar's host-memory
  #                         heuristic is wrong inside cgroups)
  #   --memory=1G           ~80% of the 1.25G container limit
  #   --overprovisioned     accepted single-node-on-shared-host compromise
  #                         (drop + `rpk redpanda tune all` if this box ever
  #                         gets dedicated cores)
  #
  # Dual listener is REQUIRED: the API runs bare-metal (localhost:19092)
  # while containerized services reach the broker at redpanda:9092.
  # enable_consumer_group_metrics exposes redpanda_kafka_consumer_group_lag_*
  # on /public_metrics for Prometheus.  NOTE: `--set redpanda.<cluster_prop>`
  # seeds .bootstrap.yaml and applies only on FIRST bootstrap of a fresh data
  # volume; for an already-bootstrapped cluster run:
  #   docker exec cortex-redpanda rpk cluster config set \
  #     enable_consumer_group_metrics '["group","partition","consumer_lag"]'
  redpanda:
    image: redpandadata/redpanda:v26.1.12
    container_name: cortex-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --set
      - redpanda.enable_consumer_group_metrics=["group","partition","consumer_lag"]
    deploy:
      resources:
        limits:
          memory: 1280M
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cortex-network

  # ── Redpanda Console (Queue Operations UI) ────────────────────────────────
  redpanda-console:
    image: redpandadata/console:v3.8.0
    container_name: cortex-redpanda-console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - cortex-network

  # ── Prometheus (Metrics) ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cortex-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.wal-compression'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - cortex-network

  # ── Grafana (Dashboards) ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: cortex-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-cortex_grafana}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/cortex/01-sre-overview.json
      GF_LOG_LEVEL: warn
      GF_LOG_MODE: console
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cortex-network

  # ── Worker Sidecar (Background Tasks + Control Plane) ────────────────────
  # Hosts all 13 background tasks under the supervised() restart framework.
  # Exposes port 8001 on the internal Docker network ONLY — never on the host.
  # The api service communicates with it via httpx over cortex-network.
  #
  # start_period: 60s accounts for ML model loading time on cold start.
  # INTERNAL_API_SECRET must be set in .env (64+ hex chars, no default).
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cortex_db}"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
    expose:
      - "8001"
    volumes:
      - ./backend/models:/app/models
      - ./.cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - cortex-network
    command:
      - uvicorn
      - app.worker_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "1"
      - --loop
      - uvloop
      - --log-level
      - info

  # ── API (FastAPI) ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cortex_db}"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
      WORKER_BASE_URL: "http://worker:8001"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./.cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cortex-network
    command:
      - /bin/sh
      - -ec
      - |
          alembic upgrade head
          exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --log-level info

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/trade-suggestions/ws
      NEXT_PUBLIC_CAI_WS_URL: ws://localhost:8000/api/v1/cai/stream
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cortex-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', { cache: 'no-store' }).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  # postgres_data_tsdb is an EXTERNAL volume created during the 2026-06-03 migration.
  # It was initialised via `docker run` and is managed outside of Compose lifecycle.
  # Do NOT declare it as a regular Compose volume — that would create a new empty one.
  postgres_data_tsdb:
    external: true
  redis_data:
  redpanda_data:
  prometheus_data:
  grafana_data:

networks:
  cortex-network:
    driver: bridge
